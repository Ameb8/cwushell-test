[project]
name = "cwushell-test"
version = "0.1.0"
description = "Collect execution evidence from CWUShell implementations for manual review"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pexpect>=4.9,<5"]

[project.scripts]
cwushell-test = "cwushell_test.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.16,<1",
    "types-pexpect>=4.9,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
required_plugins = ["pytest-timeout>=2.4"]
timeout = 60
timeout_method = "signal"
markers = ["integration: Linux tests using real PTYs and synthetic processes"]
norecursedirs = ["assignment", "reports", "transcripts", ".venv*", ".git"]

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["*.py", "*.pyi", "*.ipynb", "pyproject.toml"]
extend-exclude = ["assignment", "reports", "transcripts", ".venv*"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = '(^|/)(\.venv[^/]*|assignment|reports|transcripts|tests/fixtures)(/|$)'

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
# Check test bodies without requiring annotations on every test or fixture.
disallow_untyped_defs = false
