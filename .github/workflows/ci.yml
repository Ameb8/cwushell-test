name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        id: setup
        run: task setup

      # Run every check even if an earlier check fails; any failure fails the job.
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: task lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: task format:check

      - name: Check types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: task typecheck

      - name: Run all tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: task test
